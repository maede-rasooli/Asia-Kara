  <style>
    :root{
      --brand-light: #04c9cf;
      --brand-dark:  #05e3e8;
      --brand: var(--brand-light);
    }
    .dark { --brand: var(--brand-dark); }
    /* fade in on scroll */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.9s ease;
}

/* When visible */
.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

<body class="bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-gray-200 antialiased selection:bg-[#05e3e8]/30">
<div id="navbar-container"></div>

<!-- Welding Machinery Section -->
<section id="welding-machinery" class="mt-20 py-12 px-4 md:px-8 bg-neutral-900 reveal">
  <!-- mt-24 adds margin from top for navbar -->
  <h2 class="text-[#05e3e8] text-3xl font-bold mb-8 text-center" data-i18n="wm_section_title">
    Welding and Cutting Machinery
  </h2>

  <div id="cards-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6">
    <!-- Card 1 -->
    <a href="#" data-product="disc" class="card group bg-neutral-900 border border-white/10 rounded-2xl overflow-hidden transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_0_4px_rgba(5,227,232,0.35)]">
  <div class="w-full h-[210px] overflow-hidden">
    <img src="disc1.jpg" alt="ARC Welding Machine ARC 500A" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-500">
  </div>
  <div class="p-4 flex flex-col items-start">
    <span class="text-[#05e3e8] text-sm font-semibold mb-1"></span>
    <span class="text-white font-Vazir text-base mb-1 block" data-i18n="disc_info1"></span>
    <span class="text-gray-300 text-sm mb-2 block leading-relaxed" data-i18n="disc_info2">
    </span>
    <span class="text-[#05e3e8] font-semibold text-sm group-hover:underline" data-i18n="read_more">Read More</span>
  </div>
</a>

  </div>
  <!-- PRODUCT VIEW -->
<div id="product-view" class="hidden max-w-6xl mx-auto mt-10">

    ← Back
  </button>

  <div class="grid md:grid-cols-2 gap-8 items-start bg-neutral-900 border border-white/10 rounded-3xl p-6 md:p-10">

    <!-- IMAGE -->
    <div class="w-full h-[300px] md:h-[500px] rounded-2xl overflow-hidden">
      <img id="product-image" src="" class="w-full h-full object-cover">
    </div>

    <!-- TEXT -->
    <div>
      <h2 id="product-title" class="text-2xl md:text-3xl font-bold text-white mb-3"></h2>
      <p id="product-subtitle" class="text-gray-400 mb-6"></p>

      <div id="product-details" class="text-gray-300 leading-relaxed"></div>
    </div>

  </div>
</div>
  </section>

<div id="footer-container"></div>
